<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9b51e0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded hexagon/circle badge -->
  <rect width="64" height="64" rx="16" fill="#0b0f19" />
  <rect width="64" height="64" rx="16" stroke="url(#glowGrad)" stroke-width="2" fill="none" opacity="0.6" />
  
  <!-- Futuristic CivicPulse Lightning/Pulse Line -->
  <path d="M12 34 L24 34 L29 18 L36 46 L42 28 L47 34 L52 34" 
        stroke="url(#glowGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)" />
        
  <!-- Center Core Glow Dot -->
  <circle cx="36" cy="46" r="3" fill="#00f2fe" />
  <circle cx="29" cy="18" r="3" fill="#9b51e0" />
</svg>